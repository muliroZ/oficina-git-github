name: 💬 ChatOps - Comandos no Comentário

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write

jobs:
  slash-command:
    if: startsWith(github.event.comment.body, '/deploy-preview')
    runs-on: ubuntu-latest
    steps:
      - name: Reagir e Executar Comando
        uses: actions/github-script@v7
        with:
          script: |
            // 1. Dá uma reação de foguete no comentário da pessoa
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

            // 2. Simula geração de ambiente e responde com o link
            const id = context.payload.issue.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: id,
              body: `✅ **Ambiente de Preview Gerado!**\nO comando \`/deploy-preview\` foi executado com sucesso.\n🔗 Acesse a versão de testes da #${id} em: \`https://staging-pr-${id}.meuapp-demo.com\``
            });